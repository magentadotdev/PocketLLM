name: iOS Simulator Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JavaScript dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Build iOS Simulator app
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" | awk '/Schemes:/{getline; print $1; exit}')
          echo "Building scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: PocketLLM-iOS-Simulator
          path: build/DerivedData/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 14
